  <rect x="458" y="80" width="88" height="32" rx="16" fill="#0f766e"/>
  <text x="502" y="101" text-anchor="middle" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">Student</text>
  <text x="596" y="101" text-anchor="middle" fill="#374151" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Utvecklare</text>

  <text x="80" y="176" fill="#6b7280" font-family="Georgia, serif" font-size="13">D &#183; Anv&#228;ndarbubbla (h&#246;ger)</text>
  <rect x="318" y="190" width="322" height="52" rx="18" fill="#d1fae5"/>
  <text x="338" y="222" fill="#064e3b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Vad &#228;r en closure i JavaScript?</text>

  <text x="80" y="278" fill="#6b7280" font-family="Georgia, serif" font-size="13">E &#183; Svar + k&#228;llor under</text>
  <text x="80" y="312" fill="#111827" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">En closure minns sin omgivning</text>
  <text x="80" y="336" fill="#374151" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">En funktion som kommer ih&#229;g variabler fr&#229;n</text>
  <text x="80" y="354" fill="#374151" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">scope:et d&#228;r den skapades, &#228;ven efter att den</text>
  <text x="80" y="372" fill="#374151" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">yttre funktionen har returnerat.</text>
  <rect x="80" y="388" width="420" height="56" rx="10" fill="#111827"/>
  <text x="96" y="412" fill="#86efac" font-family="ui-monospace, Consolas, monospace" font-size="12">function yttre() {</text>
  <text x="96" y="430" fill="#d1d5db" font-family="ui-monospace, Consolas, monospace" font-size="12">  const hemlighet = 42; return () =&gt; hemlighet;</text>
  <text x="80" y="468" fill="#6b7280" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">K&#196;LLOR</text>
  <rect x="80" y="478" width="132" height="26" rx="13" fill="#fff" stroke="#0f766e"/>
  <text x="146" y="496" text-anchor="middle" fill="#0f766e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">MDN &#183; Closures</text>
  <rect x="220" y="478" width="138" height="26" rx="13" fill="#fff" stroke="#0f766e"/>
  <text x="289" y="496" text-anchor="middle" fill="#0f766e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">MDN &#183; Functions</text>

  <text x="80" y="544" fill="#6b7280" font-family="Georgia, serif" font-size="13">F &#183; Streaming &#8212; k&#228;llor n&#228;r svaret &#228;r klart</text>
  <rect x="318" y="558" width="322" height="44" rx="18" fill="#d1fae5"/>
  <text x="338" y="586" fill="#064e3b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Kan du visa ett litet exempel?</text>
  <text x="80" y="630" fill="#111827" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Ett vanligt m&#246;nster &#228;r en r&#228;knare som</text>
  <text x="80" y="650" fill="#111827" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">kapslar in sitt tillst&#229;nd&#8230; &#9612;</text>

  <text x="80" y="790" fill="#6b7280" font-family="Georgia, serif" font-size="13">C &#183; Input (alltid l&#228;ngst ner)</text>
