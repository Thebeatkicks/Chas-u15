<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 960" role="img" aria-labelledby="title-chat">
  <title id="title-chat">JS Sensei &#8212; chatt med k&#228;llor</title>
  <rect width="720" height="960" fill="#f4f1ea"/>
